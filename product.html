<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>酒款详情 - 酒链 B2B</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="configAlert" class="config-alert hidden">⚠️ Supabase 密钥还没填：打开 <code>js/config.js</code>，把第 10、13 行的占位符换成你自己的值（步骤见 <code>docs/Supabase控制台操作指南.md</code>）</div>

  <header class="topbar">
    <a class="brand" href="home.html">酒链<span>B2B</span></a>
    <nav class="topnav">
      <a href="home.html">酒款大厅</a>
      <a id="navDash" href="buyer-dashboard.html">我的后台</a>
      <a href="messages.html">消息</a>
      <a href="profile.html">资料</a>
    </nav>
    <div class="topbar-user">
      <span id="navUser" class="nav-user"></span>
      <a id="navLogin" class="btn btn-sm btn-primary hidden" href="login.html">登录</a>
      <button id="navLogout" class="btn btn-sm btn-ghost hidden" onclick="WineApp.logout()">退出</button>
    </div>
  </header>

  <main>
    <div class="detail-hero" id="detailHero"><span>🍷</span></div>
    <div class="detail-body">
      <h1 id="wName">加载中…</h1>
      <div class="detail-meta" id="wMeta"></div>
      <div class="detail-price-row">
        <span class="price-lg" id="wPrice">–</span>
        <span class="stock" id="wStock"></span>
      </div>
      <p class="detail-desc" id="wDesc"></p>
      <div class="supplier-card" id="wSupplier"></div>
    </div>
  </main>

  <div class="bottom-bar" id="actionBar">
    <button class="btn btn-ghost flex1" onclick="openInquirySheet()">立即询价</button>
    <button class="btn btn-primary flex1" id="orderBtn" onclick="openOrderSheet()">立即下单</button>
  </div>

  <!-- 询价弹层 -->
  <div class="sheet-mask" id="inquirySheet">
    <div class="sheet">
      <div class="sheet-head">
        <h3>向供应商询价</h3>
        <button class="sheet-close" onclick="WineApp.closeSheet('inquirySheet')">✕</button>
      </div>
      <div class="sheet-body">
        <label>留言（采购数量、目标价、物流要求…）
          <textarea id="inquiryMsg" rows="4" placeholder="例如：想采购 50 箱，请报含税到岸价"></textarea>
        </label>
        <label>期望单价（元/瓶，选填）
          <input type="number" id="inquiryPrice" min="0" step="0.01" placeholder="例如 45.00">
        </label>
        <button class="btn btn-primary btn-block" onclick="submitInquiry()">发送询价</button>
      </div>
    </div>
  </div>

  <!-- 下单弹层 -->
  <div class="sheet-mask" id="orderSheet">
    <div class="sheet">
      <div class="sheet-head">
        <h3>确认下单</h3>
        <button class="sheet-close" onclick="WineApp.closeSheet('orderSheet')">✕</button>
      </div>
      <div class="sheet-body">
        <div class="qty-row">
          <button class="qty-btn" onclick="changeQty(-1)">−</button>
          <input class="qty-val" id="orderQty" readonly>
          <button class="qty-btn" onclick="changeQty(1)">＋</button>
          <span class="stock">库存 <span id="orderStock">0</span> 瓶</span>
        </div>
        <div class="order-total-row">
          <span>合计金额</span>
          <span class="order-total" id="orderTotal">¥0.00</span>
        </div>
        <label>备注（选填）
          <input type="text" id="orderRemark" placeholder="例如：发江西南昌，走物流">
        </label>
        <button class="btn btn-primary btn-block" onclick="submitOrder()">提交订单</button>
        <p class="auth-tip">下单后供应商确认，确认时扣减库存</p>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/vendor-supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script>
    /* ---------- 页面逻辑：酒款详情 ---------- */

    var wine = null;
    var qty = 1;
    var esc = WineApp.escapeHtml;
    var fmtMoney = WineApp.fmtMoney;

    async function init() {
      WineApp.initNav();
      var id = WineApp.qs('id');
      if (!id || !WineApp.sb) { location.href = 'home.html'; return; }

      var res = await WineApp.sb.from('wines')
        .select('*, supplier:profiles!wines_supplier_id_fkey(company_name, contact_name, phone, region)')
        .eq('id', id)
        .maybeSingle();

      if (res.error || !res.data) {
        WineApp.toast('酒款不存在或已下架', 'error');
        location.href = 'home.html';
        return;
      }
      wine = res.data;
      render();

      // 供应商看自己的酒款：不显示询价/下单
      var p = await WineApp.currentProfile();
      if (p && p.role === 'supplier' && p.id === wine.supplier_id) {
        document.getElementById('actionBar').innerHTML =
          '<a class="btn btn-primary flex1" href="supplier-dashboard.html">这是我发布的酒款 · 去后台管理</a>';
      }
    }

    function render() {
      var icon = wine.wine_type === '起泡酒' ? '🥂' : (wine.wine_type === '白葡萄酒' ? '🥂' : '🍷');
      document.getElementById('detailHero').innerHTML = '<span>' + icon + '</span>';
      document.getElementById('wName').textContent = wine.name;

      var chips = '';
      if (wine.origin) chips += '<span class="chip chip-info">产地：' + esc(wine.origin) + '</span>';
      if (wine.vintage) chips += '<span class="chip chip-gold">' + wine.vintage + ' 年</span>';
      if (wine.variety) chips += '<span class="chip chip-ok">' + esc(wine.variety) + '</span>';
      if (wine.wine_type) chips += '<span class="chip chip-gray">' + esc(wine.wine_type) + '</span>';
      document.getElementById('wMeta').innerHTML = chips;

      document.getElementById('wPrice').textContent = fmtMoney(wine.price);
      document.getElementById('wStock').textContent = '库存 ' + wine.stock + ' 瓶';
      document.getElementById('wDesc').textContent = wine.description || '暂无描述';

      var s = wine.supplier || {};
      document.getElementById('wSupplier').innerHTML =
        '<h3>🍇 供应商：' + esc(s.company_name || '未填写') + '</h3>'
        + '<p>联系人：' + esc(s.contact_name || '—') + '　电话：' + esc(s.phone || '—') + '</p>'
        + (s.region ? '<p>地区：' + esc(s.region) + '</p>' : '');

      document.getElementById('orderStock').textContent = wine.stock;
      updateOrderUI();

      if (Number(wine.stock) <= 0) {
        var btn = document.getElementById('orderBtn');
        btn.textContent = '已售罄';
        btn.disabled = true;
      }
    }

    async function guardBuyer() {
      var user = await WineApp.currentUser();
      if (!user) {
        WineApp.toast('请先登录（访客只能浏览，不能下单）', 'info');
        WineApp.redirectToLogin();
        return false;
      }
      var p = await WineApp.currentProfile();
      if (p.role === 'supplier') {
        WineApp.toast('供应商账号不能询价/下单，请用采购商账号', 'error');
        return false;
      }
      return true;
    }

    async function openInquirySheet() {
      if (!(await guardBuyer())) return;
      WineApp.openSheet('inquirySheet');
    }

    async function submitInquiry() {
      if (!(await guardBuyer())) return;
      var user = await WineApp.currentUser();
      var message = document.getElementById('inquiryMsg').value.trim();
      var priceStr = document.getElementById('inquiryPrice').value.trim();
      if (!message) { WineApp.toast('请填写留言', 'error'); return; }

      var res = await WineApp.sb.from('inquiries').insert({
        wine_id: wine.id,
        buyer_id: user.id,
        message: message,
        expected_price: priceStr ? Number(priceStr) : null,
      });
      if (res.error) { WineApp.toast('发送失败：' + res.error.message, 'error'); return; }

      WineApp.closeSheet('inquirySheet');
      document.getElementById('inquiryMsg').value = '';
      document.getElementById('inquiryPrice').value = '';
      WineApp.toast('询价已发送，供应商回复后可在「我的询价」查看', 'success');
    }

    async function openOrderSheet() {
      if (Number(wine.stock) <= 0) { WineApp.toast('该酒款已售罄', 'error'); return; }
      if (!(await guardBuyer())) return;
      qty = 1;
      updateOrderUI();
      WineApp.openSheet('orderSheet');
    }

    function changeQty(d) {
      qty = Math.min(Math.max(qty + d, 1), Math.max(Number(wine.stock), 1));
      updateOrderUI();
    }

    function updateOrderUI() {
      document.getElementById('orderQty').value = qty;
      document.getElementById('orderTotal').textContent = fmtMoney(Number(wine.price) * qty);
    }

    async function submitOrder() {
      if (!(await guardBuyer())) return;
      var user = await WineApp.currentUser();
      var remark = document.getElementById('orderRemark').value.trim();

      var res = await WineApp.sb.from('orders').insert({
        wine_id: wine.id,
        buyer_id: user.id,
        quantity: qty,
        remark: remark,
      }).select();

      if (res.error) { WineApp.toast('下单失败：' + res.error.message, 'error'); return; }

      // 数据库触发器回填单价与总额（数据库是金额的唯一真相）
      var total = res.data && res.data[0] ? res.data[0].total_amount : 0;
      WineApp.closeSheet('orderSheet');
      WineApp.toast('下单成功，合计 ' + fmtMoney(total) + '，等待供应商确认', 'success');
      setTimeout(function () { location.href = 'buyer-dashboard.html'; }, 1200);
    }

    init();
  </script>
</body>
</html>
