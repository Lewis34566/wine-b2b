<!DOCTYPE html>
<html lang="zh-CN" data-page="sup">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>供应商后台 - 酒链 B2B</title>
  <meta name="description" id="metaDesc" content="供应商后台：管理酒款、回复询价、订单状态流转" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="configAlert" class="config-alert hidden">⚠️ Supabase 密钥还没填：打开 <code>js/config.js</code>，把第 10、13 行的占位符换成你自己的值（步骤见 <code>docs/Supabase控制台操作指南.md</code>）</div>

  <header class="topbar">
    <a class="brand" href="home.html">酒链<span>B2B</span></a>
    <nav class="topnav">
      <a href="home.html" data-i18n="nav.hall">酒款大厅</a>
      <a id="navDash" href="supplier-dashboard.html" class="active" data-i18n="nav.dash">我的后台</a>
      <a href="messages.html" data-i18n="nav.msgs">消息</a>
      <a href="profile.html" data-i18n="nav.profile">资料</a>
    </nav>
    <div class="topbar-user">
      <select data-lang-switch class="lang-switch" onchange="WineApp.setLang(this.value)">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ru">Русский</option>
      </select>
      <span id="navUser" class="nav-user"></span>
      <a id="navLogin" class="btn btn-sm btn-primary hidden" href="login.html" data-i18n="nav.login">登录</a>
      <button id="navLogout" class="btn btn-sm btn-ghost hidden" onclick="WineApp.logout()" data-i18n="nav.logout">退出</button>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <h1 data-i18n="sup.head">供应商后台</h1>
      <p class="page-sub" data-i18n="sup.sub">管理你的酒款、询价与订单</p>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="stat-num" id="statWines">–</div><div class="stat-label" data-i18n="sup.statWines">在售酒款</div></div>
      <div class="stat-card"><div class="stat-num" id="statPendingInq">–</div><div class="stat-label" data-i18n="sup.statPendingInq">待回复询价</div></div>
      <div class="stat-card"><div class="stat-num" id="statPendingOrders">–</div><div class="stat-label" data-i18n="sup.statPendingOrders">待确认订单</div></div>
    </div>

    <div class="tabs">
      <button type="button" class="tab active" data-tab="wines" onclick="switchTab('wines')" data-i18n="sup.tabWines">酒款管理</button>
      <button type="button" class="tab" data-tab="inquiries" onclick="switchTab('inquiries')" data-i18n="sup.tabInquiries">询价回复</button>
      <button type="button" class="tab" data-tab="orders" onclick="switchTab('orders')" data-i18n="sup.tabOrders">订单管理</button>
    </div>

    <section id="tab-wines" class="tab-panel">
      <div class="panel-toolbar">
        <span class="page-sub"><span id="wineCount">共 0 款</span></span>
        <button class="btn btn-primary" onclick="openWineForm()" data-i18n="sup.publish">＋ 发布酒款</button>
      </div>
      <div id="wineList" class="card-list"></div>
    </section>

    <section id="tab-inquiries" class="tab-panel hidden">
      <div id="inquiryList" class="card-list"></div>
    </section>

    <section id="tab-orders" class="tab-panel hidden">
      <div id="orderList" class="card-list"></div>
    </section>
  </main>

  <!-- 酒款表单弹层 -->
  <div class="sheet-mask" id="wineSheet">
    <div class="sheet">
      <div class="sheet-head">
        <h3 id="wineFormTitle" data-i18n="sup.formTitle">发布酒款</h3>
        <button type="button" class="sheet-close" onclick="WineApp.closeSheet('wineSheet')">✕</button>
      </div>
      <div class="sheet-body">
        <input type="hidden" id="wfId">
        <label><span data-i18n="sup.fName">酒款名称 *</span>
          <input type="text" id="wfName" placeholder="例如：蓬莱赤霞珠干红 750ml" data-i18n-ph="sup.fNamePh">
        </label>
        <div class="form-row">
          <label><span data-i18n="sup.fOrigin">产地</span>
            <input type="text" id="wfOrigin" list="originList" placeholder="例如：烟台·蓬莱" data-i18n-ph="sup.fOriginPh">
          </label>
          <label><span data-i18n="sup.fVintage">年份</span>
            <input type="number" id="wfVintage" min="1980" max="2035" placeholder="例如：2023" data-i18n-ph="sup.fVintagePh">
          </label>
        </div>
        <div class="form-row">
          <label><span data-i18n="sup.fVariety">品种</span>
            <input type="text" id="wfVariety" list="varietyList" placeholder="例如：赤霞珠" data-i18n-ph="sup.fVarietyPh">
          </label>
          <label><span data-i18n="sup.fType">类型</span>
            <select id="wfType"></select>
          </label>
        </div>
        <div class="form-row">
          <label><span data-i18n="sup.fPrice">单价（元/瓶）*</span>
            <input type="number" id="wfPrice" min="0" step="0.01" placeholder="例如：68.00" data-i18n-ph="sup.fPricePh">
          </label>
          <label><span data-i18n="sup.fStock">库存（瓶）*</span>
            <input type="number" id="wfStock" min="0" step="1" placeholder="例如：600" data-i18n-ph="sup.fStockPh">
          </label>
        </div>
        <label><span data-i18n="sup.fDesc">描述</span>
          <textarea id="wfDesc" rows="3" placeholder="口感、产区故事、物流说明…（选填）" data-i18n-ph="sup.fDescPh"></textarea>
        </label>
        <div class="form-row">
          <label><span data-i18n="sup.fNameEn">英文名（选填）</span>
            <input type="text" id="wfNameEn" data-i18n-ph="sup.fNameEnPh" placeholder="例如：Penglai Cabernet Sauvignon 2019">
          </label>
          <label><span data-i18n="sup.fNameRu">俄文名（选填）</span>
            <input type="text" id="wfNameRu" data-i18n-ph="sup.fNameRuPh" placeholder="例如：Каберне Совиньон Пэнлай 2019">
          </label>
        </div>
        <label><span data-i18n="sup.fDescEn">英文描述（选填）</span>
          <textarea id="wfDescEn" rows="2" data-i18n-ph="sup.fDescEnPh" placeholder="海外客户看到的酒款介绍"></textarea>
        </label>
        <label><span data-i18n="sup.fDescRu">俄文描述（选填）</span>
          <textarea id="wfDescRu" rows="2" data-i18n-ph="sup.fDescRuPh" placeholder="俄语客户看到的酒款介绍"></textarea>
        </label>
        <button type="button" class="btn btn-primary btn-block" onclick="saveWine()" data-i18n="sup.saveBtn">保存</button>
      </div>
    </div>
  </div>

  <datalist id="originList">
    <option>烟台·蓬莱</option><option>烟台·龙口</option><option>烟台</option>
    <option>宁夏</option><option>新疆</option><option>法国</option>
    <option>智利</option><option>意大利</option><option>西班牙</option><option>澳大利亚</option>
  </datalist>
  <datalist id="varietyList">
    <option>赤霞珠</option><option>梅洛</option><option>黑皮诺</option><option>西拉</option>
    <option>霞多丽</option><option>雷司令</option><option>长相思</option><option>佳美娜</option><option>混酿</option>
  </datalist>

  <div id="toast" class="toast"></div>

  <script src="js/vendor-supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    /* ---------- 页面逻辑：供应商后台 ---------- */

    var me = null;
    var myWines = [];
    var myInquiries = [];
    var myOrders = [];
    var tabLoaded = { wines: false, inquiries: false, orders: false };
    var esc = WineApp.escapeHtml;
    var fmtMoney = WineApp.fmtMoney;
    var fmtDate = WineApp.fmtDate;
    var t = WineApp.t;

    async function init() {
      WineApp.initNav();
      me = await WineApp.requireRole('supplier');
      if (!me) return;
      document.getElementById('wineCount').textContent = t('sup.count', { n: 0 });
      rebuildTypeOptions();
      loadStats();
      switchTab('wines');
    }

    function rebuildTypeOptions() {
      document.getElementById('wfType').innerHTML = WineApp.WINE_TYPES.map(function (v) {
        return '<option value="' + esc(v) + '">' + esc(WineApp.wineTypeLabel(v)) + '</option>';
      }).join('');
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(function (b) {
        b.classList.toggle('active', b.dataset.tab === tab);
      });
      document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.add('hidden'); });
      document.getElementById('tab-' + tab).classList.remove('hidden');
      if (tab === 'wines' && !tabLoaded.wines) { tabLoaded.wines = true; loadWines(); }
      if (tab === 'inquiries' && !tabLoaded.inquiries) { tabLoaded.inquiries = true; loadInquiries(); }
      if (tab === 'orders' && !tabLoaded.orders) { tabLoaded.orders = true; loadOrders(); }
    }

    async function loadStats() {
      try {
        var r1 = await WineApp.sb.from('wines').select('id', { count: 'exact', head: true }).eq('supplier_id', me.id).eq('status', 'on_sale');
        document.getElementById('statWines').textContent = r1.count != null ? r1.count : '–';
      } catch (e) {}
      try {
        var r2 = await WineApp.sb.from('inquiries')
          .select('id, wines:inquiries_wine_id_fkey!inner(id, supplier_id)', { count: 'exact', head: true })
          .eq('wines.supplier_id', me.id).eq('status', 'pending');
        document.getElementById('statPendingInq').textContent = r2.count != null ? r2.count : '–';
      } catch (e) {}
      try {
        var r3 = await WineApp.sb.from('orders')
          .select('id', { count: 'exact', head: true })
          .eq('supplier_id', me.id).eq('status', 'pending_confirm');
        document.getElementById('statPendingOrders').textContent = r3.count != null ? r3.count : '–';
      } catch (e) {}
    }

    /* ---------- 酒款管理 ---------- */

    async function loadWines() {
      var res = await WineApp.sb.from('wines').select('*')
        .eq('supplier_id', me.id)
        .order('created_at', { ascending: false });
      if (res.error) { WineApp.toast(t('common.loadErr', { msg: res.error.message }), 'error'); return; }
      myWines = res.data || [];
      renderWines();
    }

    function renderWines() {
      document.getElementById('wineCount').textContent = t('sup.count', { n: myWines.length });
      document.getElementById('wineList').innerHTML = myWines.map(function (w) {
        var on = w.status === 'on_sale';
        return '<div class="list-card">'
          + '<div class="list-card-title">' + esc(WineApp.wineName(w)) + ' '
          + (on ? '<span class="chip chip-ok">' + t('sup.chipOnSale') + '</span>' : '<span class="chip chip-gray">' + t('sup.chipOff') + '</span>')
          + '</div>'
          + '<div class="list-card-meta">'
          + '<p>' + esc([WineApp.originLabel(w.origin), w.vintage ? t('common.yearSuffix', { n: w.vintage }) : '', WineApp.varietyLabel(w.variety), WineApp.wineTypeLabel(w.wine_type)].filter(Boolean).join(' · ') || t('sup.noDetail')) + '</p>'
          + '<p>' + t('sup.priceLine', { p: fmtMoney(w.price), n: w.stock }) + '</p>'
          + '</div>'
          + '<div class="list-card-actions">'
          + '<button class="btn btn-sm btn-ghost" onclick="openWineForm(\'' + w.id + '\')">' + t('sup.edit') + '</button>'
          + (on
            ? '<button class="btn btn-sm btn-ghost" onclick="toggleWine(\'' + w.id + '\', \'off_shelf\')">' + t('sup.down') + '</button>'
            : '<button class="btn btn-sm btn-primary" onclick="toggleWine(\'' + w.id + '\', \'on_sale\')">' + t('sup.reup') + '</button>')
          + '</div></div>';
      }).join('') || '<div class="empty"><div class="empty-icon">🍷</div><p>' + t('sup.emptyWines') + '</p></div>';
    }

    function openWineForm(id) {
      document.getElementById('wfId').value = '';
      document.getElementById('wfName').value = '';
      document.getElementById('wfNameEn').value = '';
      document.getElementById('wfNameRu').value = '';
      document.getElementById('wfOrigin').value = '';
      document.getElementById('wfVintage').value = '';
      document.getElementById('wfVariety').value = '';
      document.getElementById('wfType').value = '';
      document.getElementById('wfPrice').value = '';
      document.getElementById('wfStock').value = '';
      document.getElementById('wfDesc').value = '';
      document.getElementById('wfDescEn').value = '';
      document.getElementById('wfDescRu').value = '';
      document.getElementById('wineFormTitle').textContent = t(id ? 'sup.editTitle' : 'sup.formTitle');

      if (id) {
        var w = myWines.find(function (x) { return x.id === id; });
        if (w) {
          document.getElementById('wfId').value = w.id;
          document.getElementById('wfName').value = w.name || '';
          document.getElementById('wfNameEn').value = w.name_en || '';
          document.getElementById('wfNameRu').value = w.name_ru || '';
          document.getElementById('wfOrigin').value = w.origin || '';
          document.getElementById('wfVintage').value = w.vintage || '';
          document.getElementById('wfVariety').value = w.variety || '';
          document.getElementById('wfType').value = w.wine_type || '';
          document.getElementById('wfPrice').value = w.price;
          document.getElementById('wfStock').value = w.stock;
          document.getElementById('wfDesc').value = w.description || '';
          document.getElementById('wfDescEn').value = w.description_en || '';
          document.getElementById('wfDescRu').value = w.description_ru || '';
        }
      }
      WineApp.openSheet('wineSheet');
    }

    function val(id) { return document.getElementById(id).value.trim(); }

    async function saveWine() {
      var payload = {
        name: val('wfName'),
        name_en: val('wfNameEn') || null,
        name_ru: val('wfNameRu') || null,
        origin: val('wfOrigin'),
        vintage: val('wfVintage') ? Number(val('wfVintage')) : null,
        variety: val('wfVariety'),
        wine_type: val('wfType'),
        price: Number(val('wfPrice')),
        stock: Number(val('wfStock')),
        description: val('wfDesc'),
        description_en: val('wfDescEn') || null,
        description_ru: val('wfDescRu') || null,
      };
      if (!payload.name) { WineApp.toast(t('sup.needName'), 'error'); return; }
      if (!(payload.price >= 0) || val('wfPrice') === '') { WineApp.toast(t('sup.needPrice'), 'error'); return; }
      if (val('wfStock') === '' || payload.stock < 0) { WineApp.toast(t('sup.needStock'), 'error'); return; }

      var id = document.getElementById('wfId').value;
      var res = id
        ? await WineApp.sb.from('wines').update(payload).eq('id', id)
        : await WineApp.sb.from('wines').insert(Object.assign({ supplier_id: me.id }, payload));

      if (res.error) { WineApp.toast(t('common.saveErr', { msg: res.error.message }), 'error'); return; }
      WineApp.closeSheet('wineSheet');
      WineApp.toast(id ? t('sup.wineUpdated') : t('sup.winePublished'), 'success');
      loadWines();
      loadStats();
    }

    async function toggleWine(id, status) {
      var res = await WineApp.sb.from('wines').update({ status: status }).eq('id', id);
      if (res.error) { WineApp.toast(t('common.opErr', { msg: res.error.message }), 'error'); return; }
      WineApp.toast(status === 'on_sale' ? t('sup.reOnSale') : t('sup.offShelved'), 'success');
      loadWines();
      loadStats();
    }

    /* ---------- 询价回复 ---------- */

    async function loadInquiries() {
      var res = await WineApp.sb.from('inquiries')
        .select('*, wines:inquiries_wine_id_fkey!inner(name, origin, vintage), buyer:inquiries_buyer_id_fkey(company_name, contact_name, phone, email)')
        .eq('wines.supplier_id', me.id)
        .order('created_at', { ascending: false });
      if (res.error) { WineApp.toast(t('sup.loadInqFail', { msg: res.error.message }), 'error'); return; }
      myInquiries = res.data || [];
      renderInquiries();
    }

    function renderInquiries() {
      document.getElementById('inquiryList').innerHTML = myInquiries.map(function (q) {
        var b = q.buyer || {};
        var w = q.wines || {};
        var replied = q.status === 'replied';
        return '<div class="list-card">'
          + '<div class="list-card-title">' + esc(b.company_name || b.email || t('sup.buyer')) + ' ' + WineApp.inquiryChip(q.status) + '</div>'
          + '<div class="list-card-meta">'
          + '<p>' + t('sup.wineLabel', { n: esc(WineApp.wineName(w)) }) + (w.vintage ? ' ' + t('common.yearSuffix', { n: w.vintage }) : '') + '</p>'
          + '<p>' + t('sup.buyerMsg') + esc(q.message || '—') + '</p>'
          + (q.expected_price != null ? '<p>' + t('sup.expectPrice') + fmtMoney(q.expected_price) + '</p>' : '')
          + '<p>' + t('sup.contactLine', { c: esc(b.contact_name || '—'), p: esc(b.phone || '—'), t: fmtDate(q.created_at) }) + '</p>'
          + '</div>'
          + '<div class="inq-reply-box">'
          + '<textarea id="replyArea_' + q.id + '" rows="2" placeholder="' + t('sup.replyPh') + '">' + esc(q.reply || '') + '</textarea>'
          + '<div class="list-card-actions" style="margin-top:8px">'
          + '<button class="btn btn-sm btn-primary" onclick="replyInquiry(\'' + q.id + '\')">' + (replied ? t('sup.updateReply') : t('sup.reply')) + '</button>'
          + '</div></div></div>';
      }).join('') || '<div class="empty"><div class="empty-icon">📩</div><p>' + t('sup.inqEmpty') + '</p></div>';
    }

    async function replyInquiry(id) {
      var reply = document.getElementById('replyArea_' + id).value.trim();
      if (!reply) { WineApp.toast(t('sup.needReply'), 'error'); return; }

      var res = await WineApp.sb.from('inquiries')
        .update({ status: 'replied', reply: reply, replied_at: new Date().toISOString() })
        .eq('id', id)
        .select();
      if (res.error) { WineApp.toast(t('sup.replyFail', { msg: res.error.message }), 'error'); return; }

      // 顺手给买家发一条站内消息
      try {
        var q = res.data[0];
        await WineApp.sb.from('messages').insert({
          sender_id: me.id,
          receiver_id: q.buyer_id,
          content: t('sup.inquiryReplyPrefix') + reply,
        });
      } catch (e) { /* 消息通知失败不影响回复 */ }

      WineApp.toast(t('sup.replied'), 'success');
      loadInquiries();
      loadStats();
    }

    /* ---------- 订单管理 ---------- */

    async function loadOrders() {
      var res = await WineApp.sb.from('orders')
        .select('*, wines:orders_wine_id_fkey(name), buyer:orders_buyer_id_fkey(company_name, contact_name)')
        .eq('supplier_id', me.id)
        .order('created_at', { ascending: false });
      if (res.error) { WineApp.toast(t('sup.loadOrderFail', { msg: res.error.message }), 'error'); return; }
      myOrders = res.data || [];
      renderOrders();
    }

    function renderOrders() {
      document.getElementById('orderList').innerHTML = myOrders.map(function (o) {
        var b = o.buyer || {};
        var w = o.wines || {};
        var actions = '';
        if (o.status === 'pending_confirm') {
          actions = '<button class="btn btn-sm btn-primary" onclick="setOrderStatus(\'' + o.id + '\', \'confirmed\')">' + t('sup.confirmOrder') + '</button>'
            + '<button class="btn btn-sm btn-ghost" onclick="setOrderStatus(\'' + o.id + '\', \'cancelled\')">' + t('sup.cancelOrder') + '</button>';
        } else if (o.status === 'confirmed') {
          actions = '<button class="btn btn-sm btn-primary" onclick="setOrderStatus(\'' + o.id + '\', \'shipped\')">' + t('sup.ship') + '</button>';
        }
        return '<div class="list-card">'
          + '<div class="list-card-title">' + t('sup.wineLabel', { n: esc(WineApp.wineName(w)) }) + WineApp.orderChip(o.status) + '</div>'
          + '<div class="list-card-meta">'
          + '<p>' + t('sup.buyer') + '：' + esc(b.company_name || '—') + '（' + esc(b.contact_name || '—') + '）</p>'
          + '<p>' + t('common.qtyLine', { q: o.quantity, p: fmtMoney(o.unit_price) }) + ' <strong>' + fmtMoney(o.total_amount) + '</strong></p>'
          + (o.remark ? '<p>' + t('sup.remark') + esc(o.remark) + '</p>' : '')
          + '<p>' + t('sup.orderTime', { a: fmtDate(o.created_at), b: fmtDate(o.updated_at) }) + '</p>'
          + '</div>'
          + (actions ? '<div class="list-card-actions">' + actions + '</div>' : '')
          + '</div>';
      }).join('') || '<div class="empty"><div class="empty-icon">📦</div><p>' + t('sup.orderEmpty') + '</p></div>';
    }

    async function setOrderStatus(id, status) {
      var res = await WineApp.sb.from('orders').update({ status: status }).eq('id', id);
      if (res.error) { WineApp.toast(t('common.opErr', { msg: res.error.message }), 'error'); return; }
      var msg = {
        confirmed: t('sup.orderConfirmed'),
        shipped: t('sup.shipped'),
        cancelled: t('sup.cancelled'),
      }[status];
      WineApp.toast(msg, 'success');
      loadOrders();
      loadStats();
    }

    WineApp.onLangChange(function () {
      rebuildTypeOptions();
      if (tabLoaded.wines) renderWines();
      if (tabLoaded.inquiries) renderInquiries();
      if (tabLoaded.orders) renderOrders();
    });

    init();
  </script>
</body>
</html>
