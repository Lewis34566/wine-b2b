<!DOCTYPE html>
<html lang="zh-CN" data-page="prof">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人资料 - 酒链 B2B</title>
  <meta name="description" id="metaDesc" content="个人资料：公司、联系方式与简介，对方会在询价/订单里看到" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="configAlert" class="config-alert hidden">⚠️ Supabase 密钥还没填：打开 <code>js/config.js</code>，把第 10、13 行的占位符换成你自己的值（步骤见 <code>docs/Supabase控制台操作指南.md</code>）</div>

  <header class="topbar">
    <a class="brand" href="home.html">酒链<span>B2B</span></a>
    <nav class="topnav">
      <a href="home.html" data-i18n="nav.hall">酒款大厅</a>
      <a id="navDash" href="buyer-dashboard.html" data-i18n="nav.dash">我的后台</a>
      <a href="messages.html" data-i18n="nav.msgs">消息</a>
      <a href="profile.html" class="active" data-i18n="nav.profile">资料</a>
    </nav>
    <div class="topbar-user">
      <select data-lang-switch class="lang-switch" onchange="WineApp.setLang(this.value)">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ru">Русский</option>
      </select>
      <span id="navUser" class="nav-user"></span>
      <a id="navLogin" class="btn btn-sm btn-primary hidden" href="login.html" data-i18n="nav.login">登录</a>
      <button id="navLogout" class="btn btn-sm btn-ghost hidden" type="button" onclick="WineApp.logout()" data-i18n="nav.logout">退出</button>
    </div>
  </header>

  <main class="page page-narrow">
    <div class="page-head">
      <h1 data-i18n="prof.head">个人资料</h1>
      <p class="page-sub" data-i18n="prof.sub">你的账号信息与联系方式（对方会在询价/订单里看到）</p>
    </div>

    <div class="card form-card">
      <div class="profile-ident">
        <div class="avatar">🍷</div>
        <div>
          <div class="profile-email" id="pfEmail">–</div>
          <div><span class="role-badge" id="pfRole">–</span></div>
        </div>
      </div>

      <label><span data-i18n="prof.company">公司名称</span>
        <input type="text" id="pfCompany" placeholder="你的公司 / 店铺名称" data-i18n-ph="prof.companyPh">
      </label>
      <div class="form-row">
        <label><span data-i18n="prof.contact">联系人</span>
          <input type="text" id="pfContact" placeholder="姓名" data-i18n-ph="prof.contactPh">
        </label>
        <label><span data-i18n="prof.phone">电话</span>
          <input type="tel" id="pfPhone" placeholder="手机 / 座机" data-i18n-ph="prof.phonePh">
        </label>
      </div>
      <label><span data-i18n="prof.region">所在地区</span>
        <input type="text" id="pfRegion" placeholder="例如：江西·南昌" data-i18n-ph="prof.regionPh">
      </label>
      <label><span data-i18n="prof.bio">简介</span>
        <textarea id="pfBio" rows="3" placeholder="一句话介绍你的货源或采购需求" data-i18n-ph="prof.bioPh"></textarea>
      </label>

      <button type="button" class="btn btn-primary btn-block" onclick="saveProfile()" data-i18n="prof.saveBtn">保存修改</button>
      <button type="button" class="btn btn-ghost btn-block" onclick="WineApp.logout()" data-i18n="prof.logoutBtn">退出登录</button>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/vendor-supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    /* ---------- 页面逻辑：个人资料 ---------- */

    var t = WineApp.t;

    var me = null;

    async function init() {
      WineApp.initNav();
      var user = await WineApp.requireAuth();
      if (!user) return;
      me = await WineApp.currentProfile();

      document.getElementById('pfEmail').textContent = me.email || '';
      var roleEl = document.getElementById('pfRole');
      roleEl.textContent = WineApp.roleLabel(me.role);
      roleEl.className = 'role-badge ' + (me.role === 'supplier' ? 'role-supplier' : 'role-buyer');

      document.getElementById('pfCompany').value = me.company_name || '';
      document.getElementById('pfContact').value = me.contact_name || '';
      document.getElementById('pfPhone').value = me.phone || '';
      document.getElementById('pfRegion').value = me.region || '';
      document.getElementById('pfBio').value = me.bio || '';
    }

    function val(id) { return document.getElementById(id).value.trim(); }

    async function saveProfile() {
      var res = await WineApp.sb.from('profiles').update({
        company_name: val('pfCompany'),
        contact_name: val('pfContact'),
        phone: val('pfPhone'),
        region: val('pfRegion'),
        bio: val('pfBio'),
      }).eq('id', me.id);

      if (res.error) { WineApp.toast(t('common.saveErr', { msg: res.error.message }), 'error'); return; }
      WineApp.toast(t('prof.saved'), 'success');
      WineApp.currentProfile(true).then(function () { WineApp.initNav(); });
    }

    WineApp.onLangChange(function () {
      if (me) {
        var el = document.getElementById('pfRole');
        if (el) el.textContent = WineApp.roleLabel(me.role);
      }
    });

    init();
  </script>
</body>
</html>
